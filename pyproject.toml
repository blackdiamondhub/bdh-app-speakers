[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-speakers"
version = "3.0.1"
description = "Black Diamond Hub app: speaker grouping, volume and playback control for Sonos and Home Assistant media players"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.29,<1",
    "soco",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-speakers"

[project.entry-points."blackdiamondhub.plugins"]
speakers = "speakers.plugin:spec"

[tool.setuptools.packages.find]
include = ["speakers", "speakers.*"]

[tool.setuptools.package-data]
speakers = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
